version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: lifeguide-postgres
    environment:
      POSTGRES_DB: lifeguide
      POSTGRES_USER: lifeguide
      POSTGRES_PASSWORD: lifeguide123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
